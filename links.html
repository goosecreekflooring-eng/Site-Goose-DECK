<!--
  Link-in-bio card, in the same format as the Goose Creek Flooring one.
-->
<style>
  :root {
    --green: #0BB751;
    --navy: #092C3D;
    --navy-hover: #0E3E55;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: clamp(1.5rem, 6vw, 4.5rem) 1rem;
    background: var(--green);
    font-family: "Montserrat", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 38rem;
    padding: clamp(2.5rem, 8vw, 5rem) clamp(1.25rem, 6vw, 5rem) clamp(2.5rem, 7vw, 4.5rem);
    background: #fff;
    border-radius: 6px;
    box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .35);
    text-align: center;
  }
  .logo { display: block; width: clamp(150px, 42vw, 200px); height: auto; margin: 0 auto clamp(2rem, 6vw, 2.75rem); }
  h1 {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .links { list-style: none; margin: 0 auto; padding: 0; max-width: 23.5rem; display: grid; gap: .8rem; }
  .links a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .55rem;
    min-height: 3.1rem;
    padding: .7rem 1rem;
    border-radius: 4px;
    background: var(--navy);
    color: #fff;
    font-size: 1.3rem;
    font-weight: 500;
    letter-spacing: .01em;
    text-decoration: none;
    text-transform: uppercase;
    transition: background-color .25s, transform .3s cubic-bezier(.34, 1.56, .64, 1), box-shadow .3s;
  }
  .links a:hover, .links a:focus-visible {
    background: var(--navy-hover);
    transform: scale(1.03);
    box-shadow: 0 10px 20px -10px rgba(9, 44, 61, .7);
  }
  .links a:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
  .links svg { width: 1.2rem; height: 1.2rem; flex: none; fill: currentColor; }
  @media (max-width: 380px) { .links a { font-size: 1.1rem; } }
  @media (prefers-reduced-motion: reduce) { .links a { transition: background-color .2s; } .links a:hover { transform: none; } }
</style>
